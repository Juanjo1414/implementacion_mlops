[project]
name = "mlops-exercise"
version = "0.1.0"
description = "Pipeline MLOps end-to-end para predecir el valor de viviendas en California"
authors = [
    {name = "Sebastian Zapata", email = "pansezapata@gmail.com"}
]
requires-python = ">=3.11"
# Dependencias de ejecución: lo que necesitan train.py, retrain.py y la API
dependencies = [
    "pandas<3",
    "scikit-learn>=1.8.0,<2.0.0",
    "mlflow>=3.11.1,<4.0.0",
    "fastapi>=0.136.1,<0.137.0",
    "uvicorn>=0.46.0,<0.47.0",
    "pyarrow<24",
    "pandas-stubs~=2.3.3",
]

[dependency-groups]
# Herramientas de desarrollo: pruebas y linting
dev = [
    "pytest>=9.0.3,<10.0.0",
    "flake8>=7.3.0,<8.0.0",
    "httpx2>=2.13.1",
]
# Análisis exploratorio (eda.ipynb); no se instala en la imagen Docker
eda = [
    "jupyter>=1.1.1,<2.0.0",
    "matplotlib>=3.10.9,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "nbformat>=5.10.4,<6.0.0",
    "sweetviz>=2.3.3",
]
# PyCaret 4 usa la API orientada a objetos y requiere habilitar su prerelease.
# Solo pycaret_experimentos.ipynb necesita este grupo; la API carga sklearn.
pycaret = [
    "pycaret==4.0.0a8",
]

[tool.uv]
# Es una aplicación (scripts), no una librería: no se empaqueta ni se instala a sí misma
package = false
# `uv sync` instala todo por defecto; Docker usa --no-default-groups
default-groups = ["dev", "eda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# La raíz del repo en sys.path para importar app, monitor, feature_store y train
pythonpath = ["."]
