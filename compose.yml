services:
  # El notebook exporta el pipeline a ./models mediante el volumen compartido.
  notebook:
    build:
      context: .
      target: notebook
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5050
    volumes:
      - ./models:/app/models
      - ./eda.ipynb:/app/eda.ipynb
      - ./pycaret_experimentos.ipynb:/app/pycaret_experimentos.ipynb
      - ./reportes:/app/reportes
    depends_on:
      - mlflow

  # Al arrancar, la API adopta el .pkl exportado si es nuevo (reiniciarla después
  # de ejecutar el cuaderno); el campeón, los lotes y el historial viven en api_data.
  # Sin ADMIN_TOKEN no se pueden subir datos ni reentrenar: ADMIN_TOKEN=... docker compose up
  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SEED_MODEL_PATH: /app/models/pycaret_housing.pkl
      DATA_DIR: /data
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MLFLOW_TRACKING_URI: http://mlflow:5050
    volumes:
      - ./models:/app/models:ro
      - api_data:/data
    restart: unless-stopped

  # SQLite y artefactos viven en un volumen nombrado, no dentro de la imagen.
  mlflow:
    build:
      context: .
      target: mlflow
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

volumes:
  mlflow_data:
  api_data:
