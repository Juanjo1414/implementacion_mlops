services:
  # El notebook exporta el pipeline a ./models mediante el volumen compartido.
  notebook:
    build:
      context: .
      target: notebook
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5050
    volumes:
      - ./models:/app/models
      - ./eda.ipynb:/app/eda.ipynb
      - ./pycaret_experimentos.ipynb:/app/pycaret_experimentos.ipynb
      - ./reportes:/app/reportes
    depends_on:
      - mlflow

  # La API lee el archivo exportado al arrancar; después de entrenar, reiniciarla.
  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_PATH: /app/models/pycaret_housing.pkl
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped

  # SQLite y artefactos viven en un volumen nombrado, no dentro de la imagen.
  mlflow:
    build:
      context: .
      target: mlflow
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

volumes:
  mlflow_data:
